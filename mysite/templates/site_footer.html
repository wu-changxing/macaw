{% load i18n wagtailcore_tags %}
{% wagtail_site as footer_site %}

    <div class="max-w-5xl mx-auto px-5 py-8 flex flex-wrap items-center justify-between gap-4 text-sm text-gray-600">

    </div>
</footer>
