{% load i18n %}
{% get_current_language as lang %}
<form action="{% url 'subscribe:new' %}" method="post" class="colophon-subscribe">
    {% csrf_token %}
    <label for="footer-subscribe-email">{% if lang|slice:":2" == "zh" %}新文章，发到你的邮箱{% else %}New posts, by email{% endif %}</label>
    <div class="colophon-row">
        <input type="email" required name="email" id="footer-subscribe-email" autocomplete="email"
               aria-label="Email address" placeholder="you@example.com">
        <button type="submit">{% if lang|slice:":2" == "zh" %}订阅{% else %}Subscribe{% endif %}</button>
    </div>
    {% if subscribe_form.errors %}<p class="colophon-error">{{ subscribe_form.errors }}</p>{% endif %}
</form>
