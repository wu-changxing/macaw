{% extends "share_base.html" %}
{% load wagtailcore_tags %}
{% block article %}
<div class="max-w-3xl mx-auto mb-6 text-sm text-gray-600">
    {% for item in page.blog_authors.all %}<span class="mr-3">{{ item.author.name }}</span>{% endfor %}
    <time datetime="{{ page.date|date:'Y-m-d' }}">{{ page.date }}</time>
</div>
<div id="article-content" class="prose prose-lg md:prose-xl max-w-3xl mx-auto text-lg md:text-xl leading-relaxed md:leading-relaxed space-y-5 text-gray-900 break-words">
    {{ page.body|richtext }}
</div>
{% endblock %}
