<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260">
  <!-- Uncoated office stock: a fine isotropic tooth plus soft formation clouds. -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".95" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .30  0 0 0 0 .33  0 0 0 0 .38  .26 0 0 0 -.115"/>
  </filter>
  <filter id="formation" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .40  0 0 0 0 .43  0 0 0 0 .48  .14 0 0 0 -.045"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#formation)"/>
  <rect width="100%" height="100%" filter="url(#tooth)"/>
</svg>
