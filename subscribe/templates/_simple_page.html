<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="flex flex-col items-center justify-center min-h-screen text-gray-600 antialiased bg-gray-100">
        <div class="relative px-4 py-10 bg-white shadow-lg sm:rounded-3xl sm:p-20 ring-1 ring-black ring-opacity-5">
            <h1 class="text-2xl font-bold text-center">{% block heading %}{% endblock %}</h1>
            <div class="mt-6 text-sm text-center text-gray-500">{% block body %}{% endblock %}</div>
            <div class="mt-8 flex items-center justify-center">
                <a href="/" class="px-4 py-2 font-semibold text-white bg-blue-600 rounded hover:bg-blue-800">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
