name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to blog-server (GCP)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/project/blog
            # Read the new script without resetting the live checkout first.
            git fetch origin main
            script=$(mktemp)
            trap 'rm -f "$script"' EXIT
            git show origin/main:scripts/deploy.sh > "$script"
            bash "$script"
