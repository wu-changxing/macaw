name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to blog-server (GCP)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/project/blog
            git fetch origin main
            git reset --hard origin/main
            ~/.local/bin/uv pip install -q -r requirements.txt --python venv/bin/python
            export DJANGO_SETTINGS_MODULE=mysite.settings.production
            venv/bin/python manage.py migrate --noinput
            venv/bin/python manage.py collectstatic --noinput
            sudo systemctl restart blog blog-worker
            sleep 5
            curl -fsS -o /dev/null -H "Host: aaron404.com" http://127.0.0.1:8000/
            echo "deployed $(git log -1 --format='%h %s')"
